name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      # The workbooks are not in the repo, so the golden suites skip here; logic tests still run.
      - run: cd engine && python -m pytest -q
      - run: python scripts/build_data.py --engine-only
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: cd web && npm ci && npm run build
        env:
          BASE: /${{ github.event.repository.name }}/
          # Public by design: the publishable key can only read what the bucket policy allows a
          # signed-in, invited user to read. The service key is never in this repo.
          VITE_SUPABASE_URL: https://acizwwhvtbuorrbhqxnb.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_Xy-rxVg62iDeREzyjRLRuw_5ONQ_8NW
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
